# Opens pull requests when a dependency has a new version.
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Libraries and plugins in gradle/libs.versions.toml. Assumption, not
  # verified yet: this also updates the Gradle wrapper, as GitHub announced
  # in 2025. There is no separate ecosystem value for the wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # One pull request per week for all AndroidX and Compose libraries, which
    # are usually released together.
    groups:
      androidx:
        patterns:
          - "androidx.*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
